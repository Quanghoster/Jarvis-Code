  md-sys-color-surface-container: "var(--popup-background-color)"
  md-sys-color-surface-container-low: "var(--primary-background-color)"
  md-sys-color-surface-container-high: "var(--secondary-background-color)"
  md-sys-color-surface-container-highest: "var(--card-background-color)"
  md-sys-color-surface-variant: "var(--card-background-color)"
  md-sys-color-on-surface: "var(--primary-text-color)"
  md-sys-color-on-surface-variant: "var(--secondary-text-color)"
  md-sys-color-primary: "var(--primary-color)"
  md-sys-color-on-primary: "var(--text-primary-color)"
  md-sys-color-secondary-container: "var(--sidebar-selected-background-color)"
  md-sys-color-on-secondary-container: "var(--primary-color)"
  md-sys-color-outline: "var(--outline-color)"
  md-sys-color-outline-variant: "var(--divider-color)"
  md-sys-color-background: "var(--primary-background-color)"
  md-sys-color-on-background: "var(--primary-text-color)"
  md-list-item-label-text-color: "var(--primary-text-color)"
  md-list-item-supporting-text-color: "var(--secondary-text-color)"
  md-list-item-leading-icon-color: "var(--state-icon-color)"
  md-list-item-container-color: "transparent"

  # v1.2.7: HA's darkSemanticColorStyles is missing fill-primary-loud-* tokens
  # and fill-primary-normal-active reuses the bright primary-40 (#009ac7).
  # Override with theme accent: dark-primary at rest/active, lighter primary on hover.
  ha-color-fill-primary-loud-resting: "var(--dark-primary-color)"
  ha-color-fill-primary-loud-hover: "var(--primary-color)"
  ha-color-fill-primary-loud-active: "var(--dark-primary-color)"
  ha-color-fill-primary-normal-resting: "var(--dark-primary-color)"
  ha-color-fill-primary-normal-hover: "var(--primary-color)"
  ha-color-fill-primary-normal-active: "var(--dark-primary-color)"
  ha-color-on-primary-quiet: "var(--primary-text-color)"
  ha-color-on-primary-normal: "var(--primary-text-color)"
  ha-color-on-primary-loud: "var(--text-primary-color)"
  # --- v1.4.0: globaler card-mod-card-Block (Bubble Card #2347 fixed) ---
  # Pop-ups sind seit offiziellem Release ausserhalb des ha-card-Trees,
  # globaler ha-card-Blur trifft sie nicht mehr -> Tier 2 wird Tier 1.
  card-mod-theme: "JARVIS"
  primary-font-family: "'Orbitron', 'Rajdhani', system-ui, sans-serif"
  secondary-font-family: "'Rajdhani', system-ui, sans-serif"
  ha-card-header-font-family: "var(--primary-font-family)"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--secondary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--secondary-font-family)"
  paper-font-button_-_font-family: "var(--primary-font-family)"
  card-mod-root: |
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
    * { font-family: var(--primary-font-family); }
  card-mod-card: &glass_card_mod |
    :where(ha-card) {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
      transition: all var(--transition-duration) var(--transition-timing-function);
    }
    :where(ha-card:hover) {
      background: var(--glass-bg-hover);
    }
    /* Heading cards are chrome-less by design. Not every frontend build ships a
       backdrop-filter reset on them, so the global blur can land on an otherwise
       invisible card. Reset it ourselves instead of relying on upstream. */
    :host(.type-heading) ha-card,
    :host(hui-heading-card) ha-card {
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
  modes:
    dark: {}