# The manifest: who made the plugin, what it may do, and what the Tessera app shows.
# Every field is explained in docs/MANIFEST.md.
id: jarvis_reactor
version: 0.1.0
api: "0.10"
icon: circle-user
maintainer: quanghoster
license: MIT
stage: beta
topics: [voice]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 18

tiles:
  - id: avatar
    name: tile_name
    icon: circle-user
    sizes: { min: 1x1, max: 2x2 }
    memory: 2400
    domains: [input_text, sensor]
    attributes: [state]
    example: tile_example
    options:
      - { id: entity, kind: text, label: entity, hint: entity_hint }
      - { id: style, kind: choice, label: style, hint: style_hint, default: reactor, choices: [
          { value: reactor, label: style_reactor },
          { value: minimal, label: style_minimal },
          { value: hex, label: style_hex }
        ]}
      - { id: tappable, kind: toggle, label: tappable, hint: tappable_hint, default: true }
