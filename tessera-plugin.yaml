# Tessera plugin manifest for JARVIS Avatar.
# Every name and label is a key into translations/<language>.json, part "app".
# See docs/MANIFEST.md in the plugins repository for full documentation.

id: jarvis_avatar
version: 0.1.0
api: "0.10"
icon: circle-user
maintainer: quanghoster
license: MIT
stage: beta
topics: [voice]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 18

permissions:
  # The tile asks for the current state of its voice state entity.
  ha_commands: ["state/get"]
  # Tap-to-wake fires an event back to Home Assistant.
  home_assistant_actions: [event.fire]

tiles:
  - id: avatar
    name: tile_name
    icon: circle-user
    sizes: { min: 1x1, max: 2x2, full: false }
    memory: 2400
    domains: [input_text, sensor]
    attributes: [state]
    example: tile_example
    preview: { title: "{name}", value: "{state}" }
    options:
      - { id: entity, kind: text, label: entity_label, hint: entity_hint }
      - { id: style, kind: choice, label: style_label, hint: style_hint, default: reactor, choices: [
          { value: reactor, label: style_reactor },
          { value: minimal, label: style_minimal },
          { value: hex, label: style_hex }
        ]}
      - { id: tappable, kind: switch, label: tappable_label, hint: tappable_hint, default: true }

settings:
  - { key: demo, label: setting_demo, hint: setting_demo_hint }
  - { key: poll, label: setting_poll, hint: setting_poll_hint }
  - { key: state, label: setting_state, hint: setting_state_hint }
